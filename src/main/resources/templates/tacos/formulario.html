<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Formulario de taco</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="container mt-4">

    <h2 class="mb-4">Formulario de taco</h2>

    <form
        th:action="@{/tacos/guardar}"
        th:object="${taco}"
        method="post"
    >

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="nombre" class="form-label">
                Nombre del taco
            </label>

            <input
                type="text"
                id="nombre"
                th:field="*{nombre}"
                class="form-control"
                placeholder="Ejemplo: Taco al pastor"
                required
            >
        </div>

        <div class="mb-3">
            <label for="precio" class="form-label">
                Precio
            </label>

            <input
                type="number"
                id="precio"
                th:field="*{precio}"
                class="form-control"
                min="0.01"
                step="0.01"
                placeholder="Ejemplo: 18.00"
                required
            >
        </div>

        <div class="mb-3">
            <label for="descripcion" class="form-label">
                Descripción
            </label>

            <textarea
                id="descripcion"
                th:field="*{descripcion}"
                class="form-control"
                rows="3"
                placeholder="Ejemplo: Taco de carne al pastor con piña"
                required
            ></textarea>
        </div>

        <div class="mb-3">
            <label for="categoria" class="form-label">
                Categoría
            </label>

            <select
                id="categoria"
                th:field="*{categoria.id}"
                class="form-select"
                required
            >
                <option value="">
                    Selecciona una categoría
                </option>

                <option
                    th:each="categoria : ${categorias}"
                    th:value="${categoria.id}"
                    th:text="${categoria.nombre}"
                >
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">
            Guardar
        </button>

        <a th:href="@{/tacos}" class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</body>

</html>
