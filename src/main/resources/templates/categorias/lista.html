<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorías</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="container mt-4">

    <h2 class="mb-4">Lista de categorías</h2>

    <div
        th:if="${mensajeExito}"
        class="alert alert-success"
        th:text="${mensajeExito}"
    >
    </div>

    <div
        th:if="${mensajeError}"
        class="alert alert-danger"
        th:text="${mensajeError}"
    >
    </div>

    <div class="mb-3">
        <a th:href="@{/categorias/nueva}" class="btn btn-primary">
            Nueva categoría
        </a>

        <a th:href="@{/tacos}" class="btn btn-secondary">
            Ver tacos
        </a>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="categoria : ${categorias}">
                <td th:text="${categoria.id}"></td>
                <td th:text="${categoria.nombre}"></td>

                <td>
                    <a
                        th:href="@{/categorias/editar/{id}(id=${categoria.id})}"
                        class="btn btn-warning btn-sm"
                    >
                        Editar
                    </a>

                    <a
                        th:href="@{/categorias/eliminar/{id}(id=${categoria.id})}"
                        class="btn btn-danger btn-sm"
                        onclick="return confirm('¿Seguro que deseas eliminar esta categoría?')"
                    >
                        Eliminar
                    </a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(categorias)}">
                <td colspan="3" class="text-center">
                    No hay categorías registradas
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
